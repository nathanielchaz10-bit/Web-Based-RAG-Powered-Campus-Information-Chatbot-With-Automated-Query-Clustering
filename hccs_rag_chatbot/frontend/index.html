<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hochi Chatbot</title>
    <link rel="icon" href="/frontend/asset/hccs_logo_seal.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <img src="/frontend/asset/hccs_logo_seal.png" alt="HCCS Seal" class="login-seal">

            <h1 class="login-school-name">HOLY CHILD CATHOLIC SCHOOL</h1>
            <p class="login-app-name">Hochi Chatbot</p>

            <div id="login-error" class="login-error hidden"></div>

            <button id="google-login-btn" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>

            <p class="restriction-notice">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Only @hccs.edu.ph accounts are authorized.
            </p>

            <div class="guest-divider"><span>or</span></div>

            <a href="/frontend/student/guest.html" class="guest-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
                </svg>
                Continue as guest
            </a>
            <p class="guest-note">Browse enrollment &amp; scholarship info without an account.</p>
        </div>
    </div>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const studentBtn = document.getElementById("dev-student-btn");
            const adminBtn = document.getElementById("dev-admin-btn");

            // Assuming devLogin is handled inside your auth.js
            if (studentBtn) {
                studentBtn.addEventListener("click", () => devLogin("Student"));
            }
            if (adminBtn) {
                adminBtn.addEventListener("click", () => devLogin("Head Admin"));
            }
        });
    </script>
</body>
</html>

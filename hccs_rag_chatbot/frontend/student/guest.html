<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochi Chatbot — Guest</title>
    <link rel="icon" href="/frontend/asset/hccs_logo_seal.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Open+Sans:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/chat.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
    <div class="app-container">
        <main class="main-content">

            <div class="guest-banner">
                <img src="/frontend/asset/hccs_logo_seal.png" alt="HCCS" class="guest-banner-logo">
                <span>You're browsing as a guest — enrollment &amp; scholarship info only.</span>
                <a href="/frontend/index.html" class="guest-signin-link">Sign in for full access</a>
            </div>

            <div class="greeting-text" id="greeting-text">
                <h1>Ask away!</h1>
                <p>Get quick answers about enrollment and scholarships at Holy Child Catholic School.</p>
            </div>

            <div id="chat-history" class="hidden"></div>

            <div class="composer">
                <div class="input-box">
                    <input type="text" id="chat-input" placeholder="Ask about enrollment or scholarships..." autocomplete="off">
                    <div class="input-actions">
                        <button class="icon-btn send-btn" id="send-btn" title="Send Message">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/faq.js"></script>
    <script src="../js/student/guest.js"></script>
</body>
</html>

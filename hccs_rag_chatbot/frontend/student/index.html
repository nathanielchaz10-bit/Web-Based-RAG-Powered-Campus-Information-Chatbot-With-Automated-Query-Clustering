<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCCS Campus Assistant</title>
    <link rel="stylesheet" href="../css/chat.css">
</head>
<body>
    <div class="app-container">

        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>HCCS CAMPUS ASSISTANT</h2>
                <p>Holy Child Catholic School</p>
            </div>

            <button class="new-chat-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New Chat
            </button>

            <div class="sidebar-menu">
                <p class="menu-label">RECENT CHATS</p>
                <ul class="history-list">
                    </ul>
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-footer-profile">
                    <div class="user-avatar" id="user-avatar">
                        <span class="avatar-initial">S</span>
                        <span class="status-dot"></span>
                    </div>
                    <div class="user-info">
                        <span class="role">Student</span>
                        <span class="display-name">Loading...</span>
                    </div>
                </div>
                <button id="logout-btn" class="logout-btn" title="Log Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="greeting-text">
                <h1>Your move!</h1>
                <p>Ask anything about the Holy Child Catholic School campus, policies, or services.</p>
            </div>

            <div id="chat-history" class="hidden">
                </div>

            <div class="composer">
                <div class="input-box">
                    <button class="icon-btn" title="Attach file (Optional visual only)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <input type="text" id="chat-input" placeholder="Ask HCCS Assistant..." autocomplete="off">
                    <div class="input-actions">
                        <button class="icon-btn send-btn" id="send-btn" title="Send Message">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student/chat.js"></script>
</body>
</html>
